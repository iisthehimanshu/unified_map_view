# ============================================================================
# Unified Map View — layer / render config for the example app.
#
# Loaded in main() before runApp and handed to UnifiedMapController as
# `styleConfig:`, so the layers are created in this state rather than flashing
# the default first.
#
# Every key is optional: anything left out keeps the renderer's own default.
# The fully annotated reference is docs/map_config.example.yaml.
#
# Edit this file and hot RESTART (not reload) to see creation-time seeding, or
# press "reload config" in the harness to re-apply it at runtime.
# ============================================================================

# ---- Global render modes ---------------------------------------------------
immersive: true
greyscale: false
fade: true

symbols:
  mode: all
  # mode: only
  # types:
  #   - washroom
  #   - lift

# ---- Per-layer control -----------------------------------------------------
# Keys are either a GROUP name (markers, rooms, route, …) or an exact STYLE
# LAYER id (normal-polygons-layer, osm-tiles-layer, …). Resolution runs
# default -> family -> member -> layer id, each step overriding only the fields
# it names.
layers:

  # Groups — the semantic taxonomy.
  markers:
    visible: true
    tappable: true

  subSectionLabels:
    opacity: 0.9

  polygons:
    visible: true
    tappable: true

  routeTraveled:
    opacity: 0.6

  # Individual style layers — for settings the whole group should not get.
  # Each inherits everything set above for its group and overrides only what it
  # names here.

  # Plain room fills get a warm tint. pattern-polygons-layer — the other half of
  # the `rooms` member — is not named, so it keeps the colour the renderer gave
  # it. Swap the comment on fill-color to see one layer change and its sibling
  # stay put.
  normal-polygons-layer:
    fill-color: "#ffe8cc"
    fill-outline-color: "#d9a441"

  # Section labels, larger and haloed, without touching any other symbol layer.
  section-markers-layer:
    text-size: 15
    text-color: "#333333"
    text-halo-color: "#ffffff"
    text-halo-width: 1.5

  # A thicker, bluer navigation route.
  path-solid-polyline-layer:
    line-width: 8
    line-color: "#0066ff"

  # The basemap raster. Outside the group taxonomy — this id is the only way to
  # reach it.
  osm-tiles-layer:
    raster-opacity: 0.85
